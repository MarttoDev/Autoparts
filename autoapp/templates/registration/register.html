{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrarse</title>
  <link rel="stylesheet" href="{% static 'autoapp/register.css' %}">
</head>
<body>
  <form method="post" style="max-width: 400px; margin: auto; padding: 2rem; border: 1px solid #ccc; border-radius: 8px;">
    <h2 style="text-align: center;">Crear cuenta</h2>
    {% csrf_token %}

    <div style="margin-bottom: 1rem;">
      {{ form.username.label_tag }}<br>
      {{ form.username }}
    </div>

    <div style="margin-bottom: 1rem;">
      {{ form.password1.label_tag }}<br>
      {{ form.password1 }}
    </div>

    <div style="margin-bottom: 1rem;">
      {{ form.password2.label_tag }}<br>
      {{ form.password2 }}
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: flex; align-items: center; gap: 0.5rem;">
        {{ form.es_mayorista }}
        ¿Eres mayorista?
      </label>
    </div>

    <button type="submit" style="width: 100%; padding: 0.5rem; font-weight: bold;">Registrarse</button>
  </form>
</body>
</html>
